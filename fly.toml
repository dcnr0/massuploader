app = "massuploader"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  FLASK_APP = "bots.py" 

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = "off"   # Disables auto-stopping/suspending completely
  auto_start_machines = true
  min_machines_running = 1     # Forces at least 1 machine to stay live 24/7
